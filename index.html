<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner">
      <div class="logo">
        <img src="arva-icon.svg" alt="" />
        <h1>ARVA</h1>
      </div>
    </div>
    <div class="main">
      <div class="info">
        <p>
          This is not real online service. You know you need something like this
          in your life to help you realize your deepest dreams.
        </p>
        <p>Sign up to get started.</p>
        <p>You know you want to.</p>
      </div>
      <div class="form-div">
        <form id="signup-form">
          <h2>Let's do this!</h2>
          <div>
            <label for="first-name">First name: </label>
            <input type="text" id="first-name" name="first-name" />
          </div>
          <div>
            <label for="last-name">Last name: </label>
            <input type="text" id="last-name" name="last-name" />
          </div>
          <div>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" />
          </div>
          <div>
            <label for="tel">Phone number: </label>
            <input type="tel" id="tel" name="tel" />
          </div>
          <div>
            <label for="password">Password: </label>
            <input type="password" id="password" name="password" />
          </div>
          <div>
            <label for="confirm-password">Confirm password: </label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
            />
          </div>
        </form>
      </div>
      <div class="submit">
        <button type="submit" form="signup-form">Create Account</button>
        <div class="already">
          <p>Already have an account? <a href="#">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
